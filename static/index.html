<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSense</title>
    <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/static/vendor/leaflet-draw/leaflet.draw.css" />
    <link rel="stylesheet" href="/static/style.css?v=5" />
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <header id="header">
                <h1>AgriSense</h1>
                <p class="muted">Remote sensing analysis</p>
            </header>

            <div id="scrollable-middle">
                <section class="panel">
                    <h3 class="section-label">Analysis</h3>
                    <div class="year-row">
                        <label class="field-label" for="year-select">Year</label>
                        <select id="year-select" class="select"></select>
                    </div>
                    <div class="tool-group">
                        <button id="btn-preview" class="btn btn-outline" title="Download and display satellite RGB imagery">Satellite preview</button>
                        <button id="btn-ndvi" class="btn btn-outline" title="Compute NDVI vegetation health index">NDVI index</button>
                        <button id="btn-timeseries" class="btn btn-outline" title="Sample NDVI across the growing season">NDVI time series</button>
                        <button id="btn-cropmap" class="btn btn-primary" title="Classify crops from the seasonal NDVI profile">Classify crops</button>
                    </div>

                    <div class="tool-group">
                        <button id="btn-sam-load" class="btn btn-outline" title="Load area into SAM for interactive segmentation">SAM segment</button>
                        <div id="sam-controls" class="hidden">
                            <div class="sam-mode">
                                <label><input type="radio" name="sam-click" value="fg" checked> Include</label>
                                <label><input type="radio" name="sam-click" value="bg"> Exclude</label>
                            </div>
                            <button id="btn-sam-clear" class="btn btn-ghost btn-sm">Clear points</button>
                        </div>
                    </div>

                    <div class="tool-group">
                        <h4 class="field-label">Change detection (NDVI, peak season)</h4>
                        <div class="change-row">
                            <select id="change-year-a" class="select"></select>
                            <span class="date-sep">→</span>
                            <select id="change-year-b" class="select"></select>
                        </div>
                        <button id="btn-change" class="btn btn-outline" title="NDVI difference between two years">Detect change</button>
                    </div>
                </section>

                <section class="panel">
                    <h3 class="section-label">Season dates</h3>
                    <div id="date-controls">
                        <label class="field-label">Spring</label>
                        <div class="date-range">
                            <input type="date" id="date-spring-start" value="2023-04-20" />
                            <span class="date-sep">–</span>
                            <input type="date" id="date-spring-end" value="2023-05-31" />
                        </div>
                        <label class="field-label">Peak</label>
                        <div class="date-range">
                            <input type="date" id="date-peak-start" value="2023-07-01" />
                            <span class="date-sep">–</span>
                            <input type="date" id="date-peak-end" value="2023-07-31" />
                        </div>
                        <label class="field-label">Late</label>
                        <div class="date-range">
                            <input type="date" id="date-late-start" value="2023-09-01" />
                            <span class="date-sep">–</span>
                            <input type="date" id="date-late-end" value="2023-09-30" />
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <h3 class="section-label">Quick regions</h3>
                    <div id="presets"><div class="preset-grid"></div></div>
                </section>

                <section class="panel">
                    <h3 class="section-label">Results</h3>
                    <div id="stats-display"><p class="muted small">Select an area and run an analysis.</p></div>
                    <div id="legend" class="hidden"></div>
                </section>
            </div>

            <section id="chat-panel">
                <h3 class="section-label">Assistant <span id="chat-provider-badge" class="badge"></span></h3>
                <div id="chat-messages">
                    <div class="chat-msg assistant">Hi — select an area and run an analysis, then ask me about the results.</div>
                </div>
                <div id="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Ask about the analysis…" />
                    <button id="chat-send" class="btn btn-primary btn-sm">Send</button>
                </div>
            </section>
        </aside>

        <main id="map-container">
            <div id="map"></div>
            <div id="job-status" class="hidden">
                <div class="status-content">
                    <div class="spinner"></div>
                    <span id="status-text">Processing…</span>
                </div>
            </div>
            <div id="bbox-info" class="hidden"></div>

            <div id="season-slider" class="hidden">
                <div class="slider-head">
                    <span class="slider-title">Season</span>
                    <span id="slider-month" class="slider-month"></span>
                </div>
                <input type="range" id="season-range" min="0" max="0" value="0" step="1" />
            </div>
        </main>
    </div>

    <script src="/static/vendor/leaflet/leaflet.js"></script>
    <script src="/static/vendor/leaflet-draw/leaflet.draw.js"></script>
    <script src="/static/vendor/plotly/plotly.min.js"></script>
    <script src="/static/app.js?v=6"></script>
</body>
</html>
