[project]
name = "agrisense"
version = "0.1.0"
description = "Remote sensing platform for satellite imagery, vegetation indices, and field segmentation"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "shapely>=2.1",
    "matplotlib>=3.10",
    "pystac-client>=0.9",
    "planetary-computer>=1.0",
    "torch>=2.0",
    "segment-anything>=1.0",
    "scipy>=1.14",
    "httpx>=0.28",
    "pydantic>=2.10",
    "mcp>=1.26",
]

[project.scripts]
agrisense = "server:main"
